[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spoxu"
version = "0.3.0"
description = "Private single-user Spotify playback automation for web and desktop."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Szymon Andrzejewski"},
  {name = "Spoxu contributors"}
]
dependencies = [
  "spotipy>=2.26.0",
  "psutil>=6.0.0",
  "Pillow>=10.0.0",
  "platformdirs>=4.0.0",
  "keyring>=25.0.0",
  "pystray>=0.19.5",
  "requests>=2.31.0"
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "itsdangerous>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=44,<47"
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "pyinstaller>=6,<7"
]

[project.scripts]
spoxu = "spotify_scheduler_pro.__main__:main"
spotify-scheduler-pro = "spotify_scheduler_pro.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spoxu_web = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
