name: Web CI

on:
  push:
    branches:
      - agent/spoxu-web-private
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[web,dev]"
      - run: python -m ruff check src/spoxu_web tests/test_web_app.py
      - run: python -m pytest -q
      - run: docker build --tag spoxu-web:test .
