name: Apply Spotify Scheduler Pro package

on:
  push:
    branches:
      - agent/spotify-scheduler-pro
    paths:
      - .github/workflows/bootstrap-pro.yml
      - .github/bootstrap/apply.py
      - .github/bootstrap/spotify-scheduler-pro.zip.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spotify-scheduler-pro
          fetch-depth: 0
      - name: Apply audited package
        run: python .github/bootstrap/apply.py
