name: Build Spoxu for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Spoxu executable
        shell: pwsh
        run: .\build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Spoxu-Windows
          path: dist/Spoxu
          if-no-files-found: error
